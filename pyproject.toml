[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constellationops"
version = "0.1.0"
description = "Real time telemetry ingestion and health monitoring platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/constellationops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
